name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 274703560582.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::274703560582:role/github-actions-sweetpixel
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/wallpaper-frontend:latest ./frontend
          docker push $ECR_REGISTRY/wallpaper-frontend:latest

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/wallpaper-backend:latest ./backend
          docker push $ECR_REGISTRY/wallpaper-backend:latest